<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Procesador CFDI</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #17202a;
        }

        header {
            background: #164b35;
            color: white;
            padding: 22px 5%;
        }

        main {
            max-width: 1150px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px #00000011;
        }

        .campo {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            max-width: 600px;
            padding: 10px;
            border: 1px solid #ccd3d8;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button,
        .btn {
            display: inline-block;
            background: #16794b;
            color: white;
            padding: 10px 18px;
            border: 0;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #e5e8ea;
            text-align: left;
            font-size: 14px;
        }

        .pending,
        .processing {
            color: #a56700;
        }

        .completed {
            color: #117a65;
        }

        .failed {
            color: #b03a2e;
        }
    </style>
</head>

<body>
    <header>
        <h1>Procesador interno de CFDI</h1>
        <div>Carga XML o ZIP, procesa y exporta una sola hoja de Excel</div>
    </header>

    <main>
        <section class="card">
            <h2>Nueva carga</h2>

            <form action="/upload" method=>
        <label for="xmlfile">XML o ZIP</label>
        <input id="xmlfile" type="file" name="xmlfile" accept=".xml,.zip" required>
    </div>

    <div class="campo">
        <label for="auxfile">Excel auxiliar</label>
        <input id="auxfile" type="file" name="auxfile" accept=".xlsx,.xls" required>
    </div>

    <button type="submit">Cargar y procesar</button>
</form>

</section>

</html>
